# Log rotation is set per service rather than globally. Without it a chatty
# container fills the disk on a small VPS and takes the whole stack down with it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- MySQL (Source of truth for jobs) ---
  mysql:
    # Pinned to an exact patch. `mysql:8.0` is a moving tag: a `pull` can change
    # the running version under you, and an 8.0.x upgrade touching InnoDB on a
    # volume with real job data is not something to discover unattended.
    image: mysql:8.0.46
    container_name: careeros-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-careeros}
      MYSQL_USER: ${MYSQL_USER:-careeros}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-careeros_password_change_me}
    # Bound to loopback only — the backend reaches this over the internal
    # careeros-net bridge network, not via this port. Only exposed at all so
    # you can `mysql -h 127.0.0.1` for local debugging; not reachable from
    # outside the host.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-careeros_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Give InnoDB time to flush and shut down cleanly; the default 10s can
    # produce a dirty-shutdown recovery on every deploy.
    stop_grace_period: 30s
    logging: *logging
    networks:
      - careeros-net

  # --- Qdrant (Vector store for semantic retrieval) ---
  qdrant:
    # Was `latest`, which is the worst of both worlds here: Qdrant's on-disk
    # format and API have changed across minors, so an unattended `pull` could
    # stop a collection from opening at all. Pin exactly.
    image: qdrant/qdrant:v1.19.2
    container_name: careeros-qdrant
    restart: unless-stopped
    # Loopback-only, same reasoning as mysql above — backend talks to qdrant
    # over careeros-net; these ports are just for local inspection.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant ships no HEALTHCHECK, and its image is debian:13-slim with
      # no curl or wget — so this uses bash's /dev/tcp plus the `read` builtin
      # and nothing else. /readyz (not /) is the point: it reports collection
      # load state, so it stays red while a large collection is still opening
      # instead of reporting a live-but-empty vector store as healthy.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 &&
          read -r line <&3 &&
          [[ "$$line" == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    logging: *logging
    networks:
      - careeros-net

  # --- Redis (shared rate-limit counters) ---
  # Behind a profile so it does NOT start on a plain `docker compose up`. Enable
  # with `docker compose --profile ratelimit up` and set REDIS_URL in .env.
  # Without it the backend uses per-process counters, which under-limit by the
  # worker count — fine for one worker, wrong for several.
  redis:
    image: redis:7.4.11-alpine
    container_name: careeros-redis
    restart: unless-stopped
    profiles: ["ratelimit"]
    # Rate-limit keys are disposable counters with TTLs; persistence buys nothing.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    logging: *logging
    networks:
      - careeros-net

  # --- Backend API (FastAPI + Uvicorn) ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careeros-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        # was service_started. Qdrant binds the port before it has finished
        # opening collections, so "started" let the backend run collection
        # init against a server that answers 503. Gate on ready instead.
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-careeros}:${MYSQL_PASSWORD:-careeros_password_change_me}@mysql:3306/${MYSQL_DATABASE:-careeros}
      JOB_API_MODE: ${JOB_API_MODE:-live}
      JOB_SOURCES: ${JOB_SOURCES:-jsearch,adzuna,remotive,remoteok,arbeitnow,company}
      LLM_PROVIDER_MODE: ${LLM_PROVIDER_MODE:-auto}
      QDRANT_URL: http://qdrant:6333
      # Shared rate-limit counters. Only meaningful with the `ratelimit` profile;
      # left empty the backend falls back to per-process counters.
      REDIS_URL: ${REDIS_URL:-}
      # Fail fast rather than silently degrade to in-memory checkpoints.
      CHECKPOINT_STRICT: ${CHECKPOINT_STRICT:-false}
      # Frontend is served on 5173 in this stack — must be in the allow-list
      # or the browser blocks every API call with a CORS error.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Secrets come from .env at container start — never baked into the image.
      # Compose fails with "no such file" if .env is absent, which is intentional:
      # APP_ENV defaults to production, and production refuses to start without
      # API_KEY. Copy .env.example to .env and set it.
    env_file:
      - .env
    ports:
      - "8000:8000"
    # Uvicorn waits for in-flight requests to finish on SIGTERM. The default 10s
    # cuts that off, so an in-flight ingest dies mid-request.
    stop_grace_period: 30s
    logging: *logging
    networks:
      - careeros-net

  # --- Frontend (React + Vite, built to a static bundle and served — not
  # the dev server. For local hot-reload development, use `npm run dev`
  # per the Frontend Setup section in the README instead of this service. ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: careeros-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - careeros-net

volumes:
  mysql_data:
  qdrant_data:
  redis_data:

networks:
  careeros-net:
    driver: bridge
