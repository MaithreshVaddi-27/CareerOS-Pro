[project]
name = "careeros"
version = "0.2.0"
description = "CareerOS — job discovery, matching, and verification pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "httpx>=0.27",
    "gradio>=4.40",
    "python-dotenv>=1.0",
    "qdrant-client>=1.10",
    "scikit-learn>=1.5",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langgraph-checkpoint-mysql[aiomysql]>=2.0",
    "slowapi>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
careeros-api = "backend.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 120
exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
# Meaningful baseline: real bugs (F = pyflakes: unused imports/vars, undefined
# names) and basic style consistency (E4/E7/E9, I = import sorting). Left off
# the pedantic/preview rule families (UP pyupgrade syntax modernization,
# BLE001 blind-except, S security-lint, SIM simplify) — this codebase uses
# broad `except Exception` deliberately in several places (provider fallback
# chains, per-job insert isolation) and those rules would flag intentional
# design, not bugs. Revisit and tighten per-rule as the codebase matures.
select = ["E4", "E7", "E9", "F", "I"]
