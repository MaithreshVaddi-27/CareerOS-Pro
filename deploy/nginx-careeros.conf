# CareerOS frontend + API reverse proxy.
#
# Install:
#   sudo cp deploy/nginx-careeros.conf /etc/nginx/sites-available/careeros
#   sudo ln -s /etc/nginx/sites-available/careeros /etc/nginx/sites-enabled/careeros
#   sudo nginx -t && sudo systemctl reload nginx
#
# The frontend is a static Vite bundle. Node is needed to BUILD it but not to
# SERVE it — nginx does that, which is the whole point of dropping the Node
# runtime from production.

upstream careeros_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name careeros.example.com;

    # Everything to HTTPS. Drop this block once TLS is terminated upstream by a
    # load balancer instead.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name careeros.example.com;

    # --- TLS ---------------------------------------------------------------
    # certbot --nginx -d careeros.example.com generates these paths.
    ssl_certificate     /etc/letsencrypt/live/careeros.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careeros.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://careeros_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;

        # Rate limiting keys on client IP. Without these, every request appears
        # to come from nginx and all clients share one bucket.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        # The API key arrives as a header and must pass through untouched.
        # Do not add proxy_set_header for it here.
        proxy_read_timeout 60s;
    }

    # --- Frontend ----------------------------------------------------------
    root /srv/careeros/frontend/dist;
    index index.html;

    # Hashed asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    # Without this, a hard refresh on /jobs/123 returns nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or browsers keep loading a stale
    # bundle that references hashed assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}