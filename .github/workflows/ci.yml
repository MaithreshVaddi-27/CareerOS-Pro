name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref. Saves CI minutes and
# avoids acting on a stale result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  # Pinned deliberately. Ruff's default rule set changes between minor releases
  # (0.17 went from ~5 rules to 400+), so an unpinned `pip install ruff` makes
  # CI fail or pass based on whatever the runner resolved that day.
  RUFF_VERSION: "0.17.1"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install "ruff==$RUFF_VERSION"
          ruff --version
          ruff check backend/ tests/ alembic/

      - name: Check migrations match models
        # Fails if the SQLAlchemy models and the Alembic revisions have drifted.
        # Also asserted by tests/test_migrations.py; running it here means a
        # drift shows up as its own named CI failure rather than a test failure
        # buried in the suite.
        # Uses a throwaway SQLite file (the models are portable types), so CI
        # needs no database service. The app itself is MySQL-only; this is only
        # a schema-equality check.
        env:
          MYSQL_PASSWORD: ci-placeholder
          API_KEY: ci-placeholder
        run: |
          DB="sqlite:///${{ runner.temp }}/schema-check.db"
          alembic -x db_url="$DB" upgrade head
          alembic -x db_url="$DB" check

      - name: Run tests
        run: python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
