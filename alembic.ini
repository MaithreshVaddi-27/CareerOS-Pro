# Alembic configuration.
#
# The DB URL is NOT set here — alembic/env.py resolves it from backend/core/config.py
# (settings.resolved_database_url) so migrations and the app can never disagree about
# which database they're talking to. Set it explicitly only to target a one-off
# database: `alembic -x db_url=... upgrade head`.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped revision filenames, sorted lexicographically = chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S